<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恩施联通政企积分查询系统</title>
<style>
:root{--unicom-red:#E60012;--unicom-dark:#1a1a2e;--unicom-gray:#f5f6fa;--card-shadow:0 2px 12px rgba(0,0,0,0.08);--border-color:#e0e0e0;--highlight:#ffeb3b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--unicom-gray);color:#333}
/* Header */
.header{background:linear-gradient(135deg,var(--unicom-red) 0%,#c5000f 100%);color:#fff;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{font-size:24px;font-weight:bold;letter-spacing:2px}
.header-title{font-size:18px;font-weight:500;opacity:.95}
.header-right{font-size:13px;opacity:.8}
/* Nav */
.nav{background:#fff;display:flex;border-bottom:1px solid var(--border-color);position:sticky;top:64px;z-index:99;overflow-x:auto}
.nav-item{padding:14px 28px;cursor:pointer;font-size:15px;color:#666;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;font-weight:500}
.nav-item:hover{color:var(--unicom-red)}
.nav-item.active{color:var(--unicom-red);border-bottom-color:var(--unicom-red)}
/* Container */
.container{max-width:1200px;margin:0 auto;padding:24px}
.tab-content{display:none}
.tab-content.active{display:block}
.section-title{font-size:22px;font-weight:bold;color:var(--unicom-dark);margin-bottom:16px;padding-left:12px;border-left:4px solid var(--unicom-red)}
/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:var(--card-shadow);text-align:center;transition:transform .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-num{font-size:32px;font-weight:bold;color:var(--unicom-red)}
.stat-label{font-size:13px;color:#888;margin-top:4px}
/* Search */
.search-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.search-input{flex:1;min-width:300px;padding:12px 16px;border:2px solid var(--border-color);border-radius:8px;font-size:15px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--unicom-red)}
.search-btn{padding:12px 28px;background:var(--unicom-red);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.search-btn:hover{opacity:.9}
.btn-outline{padding:8px 18px;background:#fff;color:var(--unicom-red);border:2px solid var(--unicom-red);border-radius:8px;font-size:14px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-outline:hover{background:var(--unicom-red);color:#fff}
/* Filter chips */
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-chip{padding:6px 16px;border:1px solid var(--border-color);border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;background:#fff;color:#666}
.filter-chip:hover{border-color:var(--unicom-red);color:var(--unicom-red)}
.filter-chip.active{background:var(--unicom-red);color:#fff;border-color:var(--unicom-red)}
/* Product table */
.product-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow)}
.product-table th{background:var(--unicom-dark);color:#fff;padding:12px 16px;text-align:left;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;user-select:none;position:relative}
.product-table th:hover{background:#0f3460}
.product-table th .sort-icon{font-size:11px;opacity:.6;margin-left:4px}
.product-table th.sort-active .sort-icon{opacity:1;color:#ff9800}
.product-table td{padding:10px 16px;border-bottom:1px solid #f0f0f0;font-size:14px}
.product-table tr:hover{background:#fff5f5}
.product-table tr:last-child td{border-bottom:none}
.product-table tr.clickable{cursor:pointer}
.cat-badge{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:bold}
.cat-yun{background:#e3f2fd;color:#1565c0}
.cat-da{background:#f3e5f5;color:#7b1fa2}
.cat-an{background:#e8f5e9;color:#2e7d32}
.cat-wu{background:#fff3e0;color:#e65100}
.margin-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:bold}
.margin-high{background:#e8f5e9;color:#2e7d32}
.margin-mid{background:#fff3e0;color:#e65100}
.calc-link{color:var(--unicom-blue);text-decoration:underline;cursor:pointer;font-size:12px}
.calc-link:hover{color:var(--unicom-red)}
/* highlight */
mark{background:var(--highlight);color:#333;padding:0 2px;border-radius:2px}
/* Rules */
.rule-toolbar{display:flex;gap:12px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.rule-group{background:#fff;border-radius:12px;box-shadow:var(--card-shadow);margin-bottom:16px;overflow:hidden}
.rule-group-header{padding:16px 20px;background:linear-gradient(90deg,var(--unicom-dark) 0%,#16213e 100%);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:bold}
.rule-group-header:hover{background:linear-gradient(90deg,#0f3460 0%,#16213e 100%)}
.rule-group-body{display:none;padding:0}
.rule-group-body.open{display:block}
.rule-item{padding:16px 20px;border-bottom:1px solid #f0f0f0}
.rule-item:last-child{border-bottom:none}
.rule-item-title{font-size:15px;font-weight:bold;color:var(--unicom-dark);margin-bottom:8px}
.rule-item-detail{font-size:13px;color:var(--unicom-red);margin-bottom:6px;font-weight:500}
.rule-item-standard{font-size:14px;color:#444;margin-bottom:6px;line-height:1.7;white-space:pre-wrap;background:#f8f9fa;padding:10px 12px;border-radius:6px;border-left:3px solid var(--unicom-red)}
.rule-item-scope{font-size:13px;color:#666;line-height:1.6;margin-bottom:6px;white-space:pre-wrap}
.rule-item-example{font-size:13px;color:#555;line-height:1.6;margin-bottom:6px;white-space:pre-wrap;background:#fffde7;padding:8px 12px;border-radius:6px}
.rule-item-note{font-size:12px;color:#999;line-height:1.5;white-space:pre-wrap}
.rule-label{display:inline-block;font-size:12px;color:#888;margin-right:6px;font-weight:bold}
/* Calculator */
.calc-card{background:#fff;border-radius:12px;box-shadow:var(--card-shadow);padding:24px;margin-bottom:20px}
.calc-row{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.calc-field{flex:1;min-width:200px}
.calc-label{font-size:14px;font-weight:500;color:#555;margin-bottom:6px;display:block}
.calc-input,.calc-select{width:100%;padding:10px 14px;border:2px solid var(--border-color);border-radius:8px;font-size:14px;outline:none;transition:border-color .2s}
.calc-input:focus,.calc-select:focus{border-color:var(--unicom-red)}
.calc-result{background:linear-gradient(135deg,var(--unicom-red) 0%,#c5000f 100%);color:#fff;border-radius:12px;padding:24px;text-align:center;margin-top:16px}
.calc-result-num{font-size:36px;font-weight:bold}
.calc-result-label{font-size:14px;opacity:.9;margin-top:4px}
.calc-detail{background:rgba(255,255,255,.15);border-radius:8px;padding:14px;margin-top:12px;font-size:13px;line-height:1.8;white-space:pre-wrap;text-align:left}
.copy-btn{margin-top:12px;padding:8px 20px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s}
.copy-btn:hover{background:rgba(255,255,255,.3)}
.copy-btn.copied{background:#4caf50;border-color:#4caf50}
/* History */
.history-list{margin-top:16px}
.history-item{background:#f8f9fa;border-radius:8px;padding:12px 16px;margin-bottom:8px;border-left:3px solid var(--unicom-red);cursor:pointer;transition:all .2s}
.history-item:hover{background:#fff5f5;transform:translateX(4px)}
.history-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.history-item-type{font-weight:bold;color:var(--unicom-dark);font-size:14px}
.history-item-time{font-size:12px;color:#999}
.history-item-points{font-size:20px;font-weight:bold;color:var(--unicom-red)}
.history-item-detail{font-size:12px;color:#888;margin-top:4px;white-space:pre-wrap;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.history-empty{text-align:center;padding:20px;color:#999;font-size:14px}
.history-clear{color:#999;font-size:12px;cursor:pointer;text-decoration:underline}
.history-clear:hover{color:var(--unicom-red)}
/* Coefficient */
.coeff-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow)}
.coeff-table th{background:var(--unicom-dark);color:#fff;padding:12px 16px;text-align:center;font-size:14px}
.coeff-table td{padding:10px 16px;border-bottom:1px solid #f0f0f0;text-align:center;font-size:14px}
.coeff-table tr:hover{background:#fff5f5}
.coeff-val{font-weight:bold;color:var(--unicom-red);font-size:16px}
/* Misc */
.no-results{text-align:center;padding:40px;color:#999;font-size:15px}
.result-count{font-size:14px;color:#888;margin-bottom:12px}
.result-count span{color:var(--unicom-red);font-weight:bold}
.note-box{background:#fff3e0;padding:10px 14px;border-radius:6px;font-size:13px;color:#e65100;margin-top:8px}
/* Mobile product cards */
.product-cards{display:none}
.product-card{background:#fff;border-radius:10px;box-shadow:var(--card-shadow);padding:14px;margin-bottom:12px;border-left:4px solid var(--unicom-red)}
.product-card-name{font-size:16px;font-weight:bold;margin-bottom:6px}
.product-card-row{display:flex;justify-content:space-between;font-size:13px;color:#666;margin-bottom:4px}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:.9}
/* Responsive */
@media(max-width:768px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .container{padding:16px}
  .header-title{display:none}
  .nav-item{padding:12px 16px;font-size:14px}
  .product-table{display:none}
  .product-cards{display:block}
}
</style>
</head>
<body>
<div class="header">
  <div class="header-left"><div class="header-logo">China Unicom</div><div class="header-title">恩施联通政企积分查询系统</div></div>
  <div class="header-right">恩施政企专业线营销业务</div>
</div>
<div class="nav">
  <div class="nav-item active" data-tab="products">产品查询</div>
  <div class="nav-item" data-tab="rules">积分规则</div>
  <div class="nav-item" data-tab="calculator">积分计算器</div>
  <div class="nav-item" data-tab="coefficient">渠道系数</div>
</div>
<div class="container">
  <!-- 产品查询 -->
  <div class="tab-content active" id="tab-products">
    <div class="section-title">小颗粒创新标品 - 主流产品清单</div>
    <div class="stats-row" id="productStats"></div>
    <div class="search-bar">
      <input type="text" class="search-input" id="productSearch" placeholder="输入产品名称、商品编码或备注进行搜索...">
      <button class="search-btn" id="searchBtn">搜索</button>
      <button class="btn-outline" id="clearSearchBtn">清除</button>
    </div>
    <div class="filter-row" id="categoryFilters"></div>
    <div class="result-count" id="productCount"></div>
    <!-- Desktop table -->
    <table class="product-table">
      <thead><tr>
        <th data-col="id">序号<span class="sort-icon"></span></th>
        <th data-col="name">产品名称<span class="sort-icon"></span></th>
        <th data-col="remark">备注<span class="sort-icon"></span></th>
        <th data-col="margin_range">毛利率<span class="sort-icon"></span></th>
        <th data-col="product_code">商品编码<span class="sort-icon"></span></th>
        <th data-col="category">大类<span class="sort-icon"></span></th>
        <th>积分规则</th>
      </tr></thead>
      <tbody id="productTableBody"></tbody>
    </table>
    <!-- Mobile cards -->
    <div class="product-cards" id="productCards"></div>
    <div class="no-results" id="noProducts" style="display:none;">未找到匹配的产品，请尝试其他关键词</div>
  </div>
  <!-- 积分规则 -->
  <div class="tab-content" id="tab-rules">
    <div class="section-title">恩施联通政企专业线营销业务积分规则</div>
    <div class="search-bar">
      <input type="text" class="search-input" id="ruleSearch" placeholder="搜索积分规则（业务类型、细分、细则）...">
    </div>
    <div class="rule-toolbar">
      <button class="btn-outline" id="expandAllBtn">全部展开</button>
      <button class="btn-outline" id="collapseAllBtn">全部收起</button>
    </div>
    <div id="rulesContainer"></div>
  </div>
  <!-- 积分计算器 -->
  <div class="tab-content" id="tab-calculator">
    <div class="section-title">积分计算器</div>
    <div class="calc-card">
      <div class="calc-row">
        <div class="calc-field">
          <label class="calc-label">选择业务类型</label>
          <select class="calc-select" id="calcType">
            <option value="">请选择业务类型</option>
            <option value="mobile_single">A-移网单卡</option>
            <option value="mobile_fusion">A-融合业务(新移+新宽)</option>
            <option value="mobile_finance">A-2B/2B2C金融合约</option>
            <option value="mobile_voice">A-移网基础语音/流量包</option>
            <option value="mobile_cloudxi">A-联通云犀</option>
            <option value="mobile_worknum">A-隐私工作号</option>
            <option value="mobile_value">A-价值经营(ARPU提升)</option>
            <option value="fixed_line_new">B-专线新发展</option>
            <option value="fixed_line_renew">B-专线存量续签</option>
            <option value="fixed_broadband_new">B-单宽新发展</option>
            <option value="fixed_broadband_renew">B-单宽续费</option>
            <option value="fixed_ftto">B-智企光网FTTO</option>
            <option value="fixed_voice_new">B-固话/语音发展</option>
            <option value="fixed_voice_renew">B-固话/语音续费</option>
            <option value="calc_std_high">C-小颗粒标品(毛利>=20%)</option>
            <option value="calc_std_mid">C-小颗粒标品(10%<=毛利<20%)</option>
            <option value="calc_iot">C-物联网连接</option>
            <option value="calc_ict">C-新兴ICT业务</option>
          </select>
        </div>
      </div>
      <div id="calcFormArea"></div>
      <div class="calc-result" id="calcResult" style="display:none;">
        <div class="calc-result-num" id="calcResultNum">0</div>
        <div class="calc-result-label">预计积分</div>
        <div class="calc-detail" id="calcDetail"></div>
        <button class="copy-btn" id="copyResultBtn">复制结果</button>
      </div>
    </div>
    <!-- 计算历史 -->
    <div class="calc-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="section-title" style="font-size:18px;margin-bottom:0;">计算历史</div>
        <span class="history-clear" id="clearHistoryBtn">清空历史</span>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
  <!-- 渠道系数 -->
  <div class="tab-content" id="tab-coefficient">
    <div class="section-title">渠道分享系数(试行)</div>
    <div class="calc-card">
      <p style="color:#666;margin-bottom:16px;font-size:14px;">根据月度总积分分档，乘以对应系数得出渠道分享积分。系数每月动态设置。</p>
      <table class="coeff-table">
        <thead><tr><th>分档</th><th>月度积分范围</th><th>分享系数</th></tr></thead>
        <tbody id="coeffTableBody"></tbody>
      </table>
    </div>
    <div class="calc-card">
      <div class="section-title" style="font-size:18px;margin-bottom:12px;">渠道积分计算</div>
      <div class="calc-row">
        <div class="calc-field">
          <label class="calc-label">输入月度总积分</label>
          <input type="number" class="calc-input" id="coeffInput" placeholder="例如：3500">
        </div>
      </div>
      <div class="calc-result" id="coeffResult" style="display:none;">
        <div class="calc-result-num" id="coeffResultNum">0</div>
        <div class="calc-result-label">渠道分享积分</div>
        <div class="calc-detail" id="coeffDetail"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>const APP_DATA = {
  "rules": [
    {
      "business_type": "A-联网（移）积分",
      "business_subtype": "移网单卡（不含隐私号、流量卡、公务号）",
      "detail": "实际月租（0，∞）",
      "standard": "标准分值 = 用户实际月租*异网系数 * 首缴系数 \n（1）异网系数：\n - 非异网，系数*0.8；\n - 异网，系数*1.2。\n（2）首缴系数：\n - 高于首缴标准，为1；\n - 低于首缴标准，为0，不核发积分。",
      "scope": "1、实际月租 = 用户入网当月实际出账月租\n月固定费：基本套餐费\n2、入网首存：入网首次预存款（取入网当月所有现金缴费）99元及以下产品需首缴100元；129及以上产品需首缴200元，否则不予以核算积分。（单位证件入网的后付费用户，建议默认首存系数为1，预核算积分，并在3/6个月进行稽核回溯，3个月內未实际缴费达标，回溯30%积分；6个月內未实际缴费达标，回溯剩余70%积分）。移网单卡首缴不达标，T+1月缴费达标后，在T+1月核发积分\n3、有效发展：积分计算当月正常在网、无欠费、非三无，则核发基础业务积分。\n4、以上不含隐私号、流量卡、公务号。\n5、个人用户及单位证件用户入网积分回溯：根据号码实际在网时长，跟踪并进行积分回溯。\n（1）在网不足1个月（即当月入网当月拆机离网用户），无积分。\n（2）用户业务办理3个月内离网或销户，回溯50%基础业务积分。预销户和销户都作为当月不计入积分的；然后个别预销户取消状态了，再回溯给发展积分。\n（3）在网时长>3个月，全额核算积分。\n（4）针对积分核算当月为三无的，T+1月进行回溯，非三无即补核发积分。\n（5）针对入网首月非全量全价计费的用户（如：按量计费、按天计费、首月半价或开通了赠费/折扣产品的），则在T+1月进行核算，T月不核算。\n6、当月高资费，次月低资费的积分回溯规则：次月,按次月月租回溯。\n7、集团证件多卡并账单卡缴费公式：并账缴费/卡数>单卡月租*80%，不触发回溯；\n8、增存判断：存量参与渠道分享；T到12月的新发展积分落到2024年的用存量拍照。\n9、单号码积分回溯规则，多条件出发回溯，回溯比例超过100%的，扣罚到0为止。\n10、移+移融合、移+宽融合的副卡，都按移网单卡计算积分。（优化）\n",
      "example": "用户 A 在2024年3月办理 59 元月租卡 1 张，每月赠送 20 元，同时办理30元流量包，未办理融合及金融合约业务，并且入网后首缴 100 元。则该用户在 202403 账期统一积分中，按实际出账，获得积分(59-20+30) 。\n",

<script>
// ===== 常量 =====
var catMap={'云':'cat-yun','大':'cat-da','安':'cat-an','物':'cat-wu'};
var catFullMap={'云':'云产品','大':'大数据','安':'安全','物':'物联网'};
var marginMap={'≥20%':'margin-high','20%>X≥10%':'margin-mid'};
var activeCategory='all';
var sortCol='';
var sortDir='asc';
var calcTypeLabels={
  'mobile_single':'A-移网单卡','mobile_fusion':'A-融合业务','mobile_finance':'A-金融合约',
  'mobile_voice':'A-语音/流量包','mobile_cloudxi':'A-联通云犀','mobile_worknum':'A-隐私工作号',
  'mobile_value':'A-价值经营','fixed_line_new':'B-专线新发展','fixed_line_renew':'B-专线续签',
  'fixed_broadband_new':'B-单宽新发展','fixed_broadband_renew':'B-单宽续费',
  'fixed_ftto':'B-智企光网FTTO','fixed_voice_new':'B-固话发展','fixed_voice_renew':'B-固话续费',
  'calc_std_high':'C-标品(毛利>=20%)','calc_std_mid':'C-标品(毛利10-20%)',
  'calc_iot':'C-物联网','calc_ict':'C-新兴ICT'
};

// ===== 工具函数 =====
function escapeHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function highlight(text,keyword){
  if(!text)return'';
  var s=escapeHtml(text);
  if(!keyword)return s;
  var escKw=escapeHtml(keyword).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return s.replace(new RegExp(escKw,'gi'),'<mark>$&</mark>');
}
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}
function saveToHistory(type,points,detail){
  try{
    var history=JSON.parse(localStorage.getItem('calcHistory')||'[]');
    history.unshift({type:type,typeLabel:calcTypeLabels[type]||type,points:points,detail:detail,time:new Date().toLocaleString('zh-CN')});
    if(history.length>10)history=history.slice(0,10);
    localStorage.setItem('calcHistory',JSON.stringify(history));
    renderHistory();
  }catch(e){}
}
function renderHistory(){
  var list=document.getElementById('historyList');
  try{
    var history=JSON.parse(localStorage.getItem('calcHistory')||'[]');
    if(history.length===0){list.innerHTML='<div class="history-empty">暂无计算历史</div>';return;}
    var html='';
    history.forEach(function(h){
      html+='<div class="history-item">';
      html+='<div class="history-item-top">';
      html+='<span class="history-item-type">'+escapeHtml(h.typeLabel)+'</span>';
      html+='<span class="history-item-time">'+escapeHtml(h.time)+'</span>';
      html+='</div>';
      html+='<div class="history-item-points">'+h.points+' 分</div>';
      html+='<div class="history-item-detail">'+escapeHtml(h.detail)+'</div>';
      html+='</div>';
    });
    list.innerHTML=html;
  }catch(e){list.innerHTML='<div class="history-empty">暂无计算历史</div>';}
}

// ===== Tab 切换 (带记忆) =====
function switchTab(tabName){
  document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active');});
  document.getElementById('tab-'+tabName).classList.add('active');
  document.querySelector('.nav-item[data-tab="'+tabName+'"]').classList.add('active');
  try{localStorage.setItem('lastTab',tabName);}catch(e){}
}
document.querySelectorAll('.nav-item').forEach(function(item){
  item.addEventListener('click',function(){switchTab(this.getAttribute('data-tab'));});
});

// ===== 产品统计 =====
function renderProductStats(){
  var products=APP_DATA.products;
  var cats={};
  products.forEach(function(p){cats[p.category]=(cats[p.category]||0)+1;});
  var html='<div class="stat-card"><div class="stat-num">'+products.length+'</div><div class="stat-label">产品总数</div></div>';
  Object.keys(cats).forEach(function(c){
    html+='<div class="stat-card"><div class="stat-num">'+cats[c]+'</div><div class="stat-label">'+catFullMap[c]+'</div></div>';
  });
  var count=(html.match(/stat-card/g)||[]).length;
  for(var i=count;i<4;i++){html+='<div class="stat-card"><div class="stat-num">-</div><div class="stat-label">-</div></div>';}
  document.getElementById('productStats').innerHTML=html;
}

// ===== 分类筛选 =====
function renderCategoryFilters(){
  var cats=[];
  APP_DATA.products.forEach(function(p){if(cats.indexOf(p.category)===-1)cats.push(p.category);});
  var html='<div class="filter-chip active" data-cat="all">全部</div>';
  cats.forEach(function(c){html+='<div class="filter-chip" data-cat="'+c+'">'+catFullMap[c]+'</div>';});
  document.getElementById('categoryFilters').innerHTML=html;
  document.querySelectorAll('#categoryFilters .filter-chip').forEach(function(chip){
    chip.addEventListener('click',function(){
      document.querySelectorAll('#categoryFilters .filter-chip').forEach(function(el){el.classList.remove('active');});
      this.classList.add('active');
      activeCategory=this.getAttribute('data-cat');
      renderProducts();
    });
  });
}

// ===== 搜索事件 =====
document.getElementById('productSearch').addEventListener('input',renderProducts);
document.getElementById('searchBtn').addEventListener('click',renderProducts);
document.getElementById('clearSearchBtn').addEventListener('click',function(){
  document.getElementById('productSearch').value='';renderProducts();document.getElementById('productSearch').focus();
});
document.getElementById('ruleSearch').addEventListener('input',renderRules);

// ===== 产品积分规则 =====
function getPointsRuleForProduct(p){
  if(p.margin_range==='≥20%')return '增量:实缴x7%(封顶5000) | 存量:实缴x5%(封顶2000)';
  if(p.margin_range==='20%>X≥10%')return '增量:实缴x5%(封顶3000) | 存量:实缴x3%(封顶1000)';
  return '-';
}

// ===== 排序 =====
document.querySelectorAll('.product-table th[data-col]').forEach(function(th){
  th.addEventListener('click',function(){
    var col=this.getAttribute('data-col');
    if(sortCol===col){sortDir=sortDir==='asc'?'desc':'asc';}
    else{sortCol=col;sortDir='asc';}
    document.querySelectorAll('.product-table th').forEach(function(t){
      t.classList.remove('sort-active');
      var icon=t.querySelector('.sort-icon');
      if(icon)icon.textContent='';
    });
    this.classList.add('sort-active');
    this.querySelector('.sort-icon').textContent=sortDir==='asc'?' ▲':' ▼';
    renderProducts();
  });
});

// ===== 渲染产品列表 =====
function renderProducts(){
  var keyword=document.getElementById('productSearch').value.trim().toLowerCase();
  var kwOriginal=document.getElementById('productSearch').value.trim();
  var filtered=APP_DATA.products.slice();
  if(activeCategory!=='all'){
    filtered=filtered.filter(function(p){return p.category===activeCategory;});
  }
  if(keyword){
    filtered=filtered.filter(function(p){
      return p.name.toLowerCase().indexOf(keyword)!==-1||
             (p.product_code||'').toLowerCase().indexOf(keyword)!==-1||
             (p.remark||'').toLowerCase().indexOf(keyword)!==-1;
    });
  }
  // 排序
  if(sortCol){
    filtered.sort(function(a,b){
      var va=(a[sortCol]||'').toString().toLowerCase();
      var vb=(b[sortCol]||'').toString().toLowerCase();
      // 数字排序
      if(sortCol==='id'){va=parseInt(va)||0;vb=parseInt(vb)||0;}
      if(va<vb)return sortDir==='asc'?-1:1;
      if(va>vb)return sortDir==='asc'?1:-1;
      return 0;
    });
  }
  document.getElementById('productCount').innerHTML='共找到 <span>'+filtered.length+'</span> 个产品';
  if(filtered.length===0){
    document.getElementById('productTableBody').innerHTML='';
    document.getElementById('productCards').innerHTML='';
    document.getElementById('noProducts').style.display='block';
    return;
  }
  document.getElementById('noProducts').style.display='none';
  // 桌面表格
  var html='';
  filtered.forEach(function(p){
    var catClass=catMap[p.category]||'';
    var marginClass=marginMap[p.margin_range]||'';
    html+='<tr class="clickable" data-calc-type="'+getCalcTypeForProduct(p)+'">';
    html+='<td>'+p.id+'</td>';
    html+='<td style="font-weight:500;">'+highlight(p.name,kwOriginal)+'</td>';
    html+='<td style="color:#888;">'+highlight(p.remark||'-',kwOriginal)+'</td>';
    html+='<td><span class="margin-badge '+marginClass+'">'+p.margin_range+'</span></td>';
    html+='<td style="font-size:12px;color:#666;">'+highlight(p.product_code||'-',kwOriginal)+'</td>';
    html+='<td><span class="cat-badge '+catClass+'">'+catFullMap[p.category]+'</span></td>';
    html+='<td style="font-size:12px;color:#555;">'+getPointsRuleForProduct(p)+'</td>';
    html+='</tr>';
  });
  document.getElementById('productTableBody').innerHTML=html;
  // 移动端卡片
  var cardHtml='';
  filtered.forEach(function(p){
    var catClass=catMap[p.category]||'';
    var marginClass=marginMap[p.margin_range]||'';
    cardHtml+='<div class="product-card" data-calc-type="'+getCalcTypeForProduct(p)+'">';
    cardHtml+='<div class="product-card-name">'+highlight(p.name,kwOriginal)+'</div>';
    cardHtml+='<div class="product-card-row"><span>编码: '+highlight(p.product_code||'-',kwOriginal)+'</span><span><span class="cat-badge '+catClass+'">'+catFullMap[p.category]+'</span></span></div>';
    cardHtml+='<div class="product-card-row"><span>毛利率: <span class="margin-badge '+marginClass+'">'+p.margin_range+'</span></span></div>';
    if(p.remark)cardHtml+='<div class="product-card-row" style="color:#999;">'+highlight(p.remark,kwOriginal)+'</div>';
    cardHtml+='</div>';
  });
  document.getElementById('productCards').innerHTML=cardHtml;
  // 绑定点击跳转计算器
  document.querySelectorAll('[data-calc-type]').forEach(function(el){
    el.addEventListener('click',function(){
      var ct=this.getAttribute('data-calc-type');
      if(ct){
        switchTab('calculator');
        document.getElementById('calcType').value=ct;
        updateCalcForm();
        showToast('已切换到积分计算器');
      }
    });
  });
}

// 产品对应的计算器类型
function getCalcTypeForProduct(p){
  if(p.margin_range==='≥20%')return 'calc_std_high';
  if(p.margin_range==='20%>X≥10%')return 'calc_std_mid';
  return '';
}

// ===== 渲染积分规则 =====
function renderRules(){
  var keyword=document.getElementById('ruleSearch').value.trim().toLowerCase();
  var kwOriginal=document.getElementById('ruleSearch').value.trim();
  var groups={};
  APP_DATA.rules.forEach(function(r){
    if(!groups[r.business_type])groups[r.business_type]=[];
    groups[r.business_type].push(r);
  });
  var html='';
  Object.keys(groups).forEach(function(type){
    var rules=groups[type];
    if(keyword){
      rules=rules.filter(function(r){
        return r.business_type.toLowerCase().indexOf(keyword)!==-1||
               r.business_subtype.toLowerCase().indexOf(keyword)!==-1||
               r.detail.toLowerCase().indexOf(keyword)!==-1||
               r.standard.toLowerCase().indexOf(keyword)!==-1;
      });
    }
    if(rules.length===0)return;
    html+='<div class="rule-group">';
    html+='<div class="rule-group-header"><span>'+highlight(type,kwOriginal)+' ('+rules.length+'条)</span><span class="toggle-icon">+</span></div>';
    html+='<div class="rule-group-body">';
    rules.forEach(function(r){
      html+='<div class="rule-item">';

// ===== 计算积分 =====
function doCalc(){
  var type=document.getElementById('calcType').value;
  if(!type)return;
  function v(id){var el=document.getElementById('calc_'+id);return el?(parseFloat(el.value)||0):0;}
  function vs(id){var el=document.getElementById('calc_'+id);return el?el.value:'';}
  // 检查是否有输入
  var hasInput=false;
  document.querySelectorAll('#calcFormArea input').forEach(function(el){
    if(el.value&&el.value!=='')hasInput=true;
  });
  if(!hasInput){document.getElementById('calcResult').style.display='none';return;}

  var points=0,detail='';
  switch(type){
    case'mobile_single':{
      var r=v('rent'),u=parseFloat(vs('isUnicom')),f=parseFloat(vs('firstPay'));
      points=r*u*f;
      detail='计算: '+r+' x '+u+'(异网系数) x '+f+'(首缴系数) = '+points.toFixed(1)+' 分';
      break;}
    case'mobile_fusion':{
      var r=v('rent'),u=parseFloat(vs('isUnicom')),f=parseFloat(vs('firstPay'));
      points=r*1.2*u*f;
      detail='计算: '+r+' x 1.2(融合系数) x '+u+'(异网) x '+f+'(首缴) = '+points.toFixed(1)+' 分';
      break;}
    case'mobile_finance':{
      var r=v('rent'),u=parseFloat(vs('isUnicom')),f=parseFloat(vs('firstPay'));
      points=r*u*f*2;
      detail='计算: '+r+' x '+u+'(异网) x '+f+'(首缴) x 2(金融合约) = '+points.toFixed(1)+' 分';
      break;}
    case'mobile_voice':{
      var r=v('rent');points=r*1;
      detail='计算: '+r+' x 1 = '+points.toFixed(1)+' 分 (需月租>=10元)';
      break;}
    case'mobile_cloudxi':{
      var r=v('rent');points=r*1;
      detail='计算: '+r+' x 1 = '+points.toFixed(1)+' 分';
      break;}
    case'mobile_worknum':{
      var r=v('rent'),c=v('count');points=r*1*c;
      detail='计算: '+r+' x 1 x '+c+'(号码数) = '+points.toFixed(1)+' 分 (需月租>=25元)';
      break;}
    case'mobile_value':{
      var d=v('diff'),l=parseFloat(vs('level'));points=d*l;
      detail='计算: '+d+'(ARPU差值) x '+l+'(倍数) = '+points.toFixed(1)+' 分';
      break;}
    case'fixed_line_new':{
      var r=v('rent'),d=v('discount')||1,po=v('postPaid'),pr=v('prePaid');
      var dp=r*0.14;var pp=(po*0.6+pr*0.8)*0.10;points=dp*d+pp;
      var capped=false;if(points>8000){points=8000;capped=true;}
      detail='发展积分: '+r+' x 14% x '+d+' = '+dp.toFixed(1)+'\n';
      detail+='回款积分: ('+po+'x0.6 + '+pr+'x0.8) x 10% = '+pp.toFixed(1)+'\n';
      detail+='合计: '+points.toFixed(1)+' 分'+(capped?' (已触达月封顶8000)':' (月封顶8000)');
      break;}
    case'fixed_line_renew':{
      var po=v('postPaid'),pr=v('prePaid');points=(po*0.6+pr*0.8)*0.03;
      if(points>5000)points=5000;
      detail='计算: ('+po+'x0.6 + '+pr+'x0.8) x 3% = '+points.toFixed(1)+' 分 (月封顶5000)';
      break;}
    case'fixed_broadband_new':{
      var r=v('rent'),pt=parseFloat(vs('payType'));points=r*1*pt;
      detail='计算: '+r+' x 1 x '+pt+'(趸交系数) = '+points.toFixed(1)+' 分';
      break;}
    case'fixed_broadband_renew':{
      var r=v('rent');points=r*0.05;
      detail='计算: '+r+' x 5% = '+points.toFixed(1)+' 分 (入网13-36个月)';
      break;}
    case'fixed_ftto':{
      var b=v('bill'),ver=vs('ver');
      if(ver==='lump50'){points=b*0.5;detail='趸交版: '+b+' x 50% = '+points.toFixed(1)+' 分';}
      else if(ver==='lump100'){points=b*1.0;detail='焕新趸交版: '+b+' x 100% = '+points.toFixed(1)+' 分';}
      else{points=b*1.0;detail='分月版发展积分: '+b+' x 100% = '+points.toFixed(1)+' 分\n另计: 月出账x20%x12个月的出账积分';}
      break;}
    case'fixed_voice_new':{
      var b=v('bill');points=Math.min(b*0.12,2000);
      detail='计算: '+b+' x 12% = '+(b*0.12).toFixed(1)+' 分 (封顶2000)\n实际: '+points.toFixed(1)+' 分';
      break;}
    case'fixed_voice_renew':{
      var b=v('bill');points=Math.min(b*0.05,1000);
      detail='计算: '+b+' x 5% = '+(b*0.05).toFixed(1)+' 分 (封顶1000)\n实际: '+points.toFixed(1)+' 分';
      break;}
    case'calc_std_high':{
      var a=v('amount'),t=parseFloat(vs('type'));var cap=t===7?5000:2000;
      points=Math.min(a*t/100,cap);
      detail='计算: '+a+' x '+t+'% = '+(a*t/100).toFixed(1)+' 分 (封顶'+cap+')\n实际: '+points.toFixed(1)+' 分';
      break;}
    case'calc_std_mid':{
      var a=v('amount'),t=parseFloat(vs('type'));var cap=t===5?3000:1000;
      points=Math.min(a*t/100,cap);
      detail='计算: '+a+' x '+t+'% = '+(a*t/100).toFixed(1)+' 分 (封顶'+cap+')\n实际: '+points.toFixed(1)+' 分';
      break;}
    case'calc_iot':{
      var a=v('amount'),t=parseFloat(vs('type'));var cap=t===7?5000:3000;
      points=Math.min(a*t/100,cap);
      detail='计算: '+a+' x '+t+'% = '+(a*t/100).toFixed(1)+' 分 (封顶'+cap+')\n实际: '+points.toFixed(1)+' 分';
      break;}
    case'calc_ict':{
      var a=v('amount');var yuan=a*10000;points=Math.min(yuan/1000,10000);
      detail='计算: '+yuan+'元 / 1000 = '+(yuan/1000).toFixed(1)+' 分 (年封顶10000)';
      break;}
  }
  document.getElementById('calcResult').style.display='block';
  document.getElementById('calcResultNum').textContent=points.toFixed(1);
  document.getElementById('calcDetail').textContent=detail;
  // 保存到历史
  saveToHistory(type,points.toFixed(1),detail);
}

// ===== 复制结果 =====
document.getElementById('copyResultBtn').addEventListener('click',function(){
  var type=document.getElementById('calcType');
  var typeLabel=type.options[type.selectedIndex]?type.options[type.selectedIndex].text:'';
  var points=document.getElementById('calcResultNum').textContent;
  var detail=document.getElementById('calcDetail').textContent;
  var text='【积分计算结果】\n业务类型: '+typeLabel+'\n预计积分: '+points+' 分\n\n'+detail+'\n\n(恩施联通政企积分查询系统)';
  var self=this;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      self.classList.add('copied');self.textContent='已复制';
      setTimeout(function(){self.classList.remove('copied');self.textContent='复制结果';},2000);
      showToast('已复制到剪贴板');
    }).catch(function(){fallbackCopy(text,self);});
  }else{fallbackCopy(text,self);}
});
function fallbackCopy(text,btn){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');
    btn.classList.add('copied');btn.textContent='已复制';
    setTimeout(function(){btn.classList.remove('copied');btn.textContent='复制结果';},2000);
    showToast('已复制到剪贴板');
  }catch(e){showToast('复制失败,请手动选择复制');}
  document.body.removeChild(ta);
}

// ===== 渠道积分计算 =====
document.getElementById('coeffInput').addEventListener('input',calcChannelShare);
function calcChannelShare(){
  var input=parseFloat(document.getElementById('coeffInput').value);
  if(isNaN(input)||input<=0){document.getElementById('coeffResult').style.display='none';return;}
  var coeff=0.1,range='';
  if(input<1000){coeff=0.9;range='(0,1000)';}
  else if(input<2000){coeff=0.8;range='[1000,2000)';}
  else if(input<3000){coeff=0.7;range='[2000,3000)';}
  else if(input<4000){coeff=0.6;range='[3000,4000)';}
  else if(input<5000){coeff=0.5;range='[4000,5000)';}
  else if(input<6000){coeff=0.4;range='[5000,6000)';}
  else if(input<7000){coeff=0.3;range='[6000,7000)';}
  else if(input<10000){coeff=0.2;range='[7000,10000)';}
  else if(input<20000){coeff=0.15;range='[10000,20000)';}
  else{coeff=0.1;range='[20000,无穷)';}
  var result=input*coeff;
  document.getElementById('coeffResult').style.display='block';
  document.getElementById('coeffResultNum').textContent=result.toFixed(1);
  document.getElementById('coeffDetail').textContent=
    '月度总积分 '+input+' 分, 对应分档 '+range+', 系数 '+coeff+'\n'+
    '渠道分享积分 = '+input+' x '+coeff+' = '+result.toFixed(1)+' 分';
}
